<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0d14">
<title>SKFaq · Masuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <div class="brand-mark" aria-hidden="true">SK</div>
      <div>
        <div class="auth-title">SKFaq</div>
        <div class="auth-sub">Jurnal Trading &amp; Keuangan Pribadi</div>
      </div>
    </div>

    <div class="holiday-banner" id="setupBanner" style="display:none;margin:0 0 18px;color:var(--gold-bright);background:var(--gold-glow);border-color:var(--gold-deep)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
      </svg>
      <span>Belum ada akun di sistem ini. Akun pertama yang didaftarkan menjadi <strong>admin</strong> dan mewarisi seluruh data yang sudah ada.</span>
    </div>

    <div class="tabs" id="authTabs" role="group" aria-label="Pilih aksi" style="margin-bottom:20px">
      <button class="tab active" data-auth="login" type="button" style="flex:1">Masuk</button>
      <button class="tab" data-auth="register" type="button" style="flex:1">Daftar</button>
    </div>

    <form id="authForm" novalidate>
      <div class="field" style="margin-bottom:14px">
        <label for="aUser">Username</label>
        <input class="input" type="text" id="aUser" autocomplete="username" autocapitalize="none"
               spellcheck="false" placeholder="mis. faqih" style="font-family:'Manrope',sans-serif;font-size:15px">
        <span class="field-hint" id="hUser"></span>
      </div>

      <div class="field" style="margin-bottom:14px">
        <label for="aPass">Password</label>
        <div class="input-wrap">
          <input class="input" type="password" id="aPass" autocomplete="current-password"
                 placeholder="••••••••" style="font-family:'Manrope',sans-serif;font-size:15px;padding-right:46px">
          <button type="button" class="pass-toggle" id="passToggle" aria-label="Tampilkan password">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <span class="field-hint" id="hPass"></span>
      </div>

      <div class="field" id="confirmWrap" style="display:none;margin-bottom:14px">
        <label for="aPass2">Ulangi Password</label>
        <input class="input" type="password" id="aPass2" autocomplete="new-password"
               placeholder="••••••••" style="font-family:'Manrope',sans-serif;font-size:15px">
        <span class="field-hint" id="hPass2"></span>
      </div>

      <button class="btn btn-primary" id="authSubmit" type="submit" style="width:100%;margin-top:6px">
        <span class="spinner" aria-hidden="true"></span><span class="btn-label">Masuk</span>
      </button>
    </form>

    <p class="auth-foot" id="authFoot">Data setiap akun terpisah penuh.</p>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  const WORKER_URL = 'https://worker-bot.jihadwajib68.workers.dev';
  const API_BASE = (function () {
    try {
      if (location.protocol === 'file:' || !location.host) return WORKER_URL;
      return location.host === new URL(WORKER_URL).host ? '' : WORKER_URL;
    } catch (e) { return WORKER_URL; }
  })();

  const TOKEN_KEY = 'skfaq_token';
  const USER_KEY = 'skfaq_user';
  const $ = (id) => document.getElementById(id);
  let mode = 'login';

  const ICONS = {
    success: '<polyline points="20 6 9 17 4 12"/>',
    error: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
    info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>'
  };

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  function toast(msg, type) {
    const kind = type || 'info';
    const el = document.createElement('div');
    el.className = 'toast ' + kind;
    el.innerHTML = '<svg class="toast-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">' +
      ICONS[kind] + '</svg><span>' + escapeHtml(msg) + '</span>';
    $('toasts').appendChild(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260); }, 4000);
  }

  async function api(path, body) {
    const res = await fetch(API_BASE + path, {
      method: body ? 'POST' : 'GET',
      cache: 'no-store',
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined
    });
    let data = null;
    try { data = await res.json(); } catch (e) { /* noop */ }
    if (!res.ok || (data && data.ok === false)) {
      throw new Error((data && data.error) || ('HTTP ' + res.status));
    }
    return data;
  }

  function setMode(next) {
    mode = next;
    document.querySelectorAll('.tab[data-auth]').forEach((t) => {
      t.classList.toggle('active', t.dataset.auth === next);
    });
    $('confirmWrap').style.display = next === 'register' ? 'flex' : 'none';
    $('authSubmit').querySelector('.btn-label').textContent = next === 'register' ? 'Daftar' : 'Masuk';
    $('aPass').autocomplete = next === 'register' ? 'new-password' : 'current-password';
    $('hPass').textContent = next === 'register' ? 'Minimal 8 karakter.' : '';
    $('hUser').textContent = next === 'register' ? '3–32 karakter: huruf, angka, titik, _ atau -' : '';
    $('authFoot').textContent = next === 'register'
      ? 'Akun baru dimulai dengan data kosong.'
      : 'Data setiap akun terpisah penuh.';
  }

  document.querySelectorAll('.tab[data-auth]').forEach((tab) => {
    tab.addEventListener('click', () => setMode(tab.dataset.auth));
  });

  $('passToggle').addEventListener('click', () => {
    const f = $('aPass');
    f.type = f.type === 'password' ? 'text' : 'password';
    $('passToggle').classList.toggle('on', f.type === 'text');
  });

  $('authForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();

    const username = $('aUser').value.trim().toLowerCase();
    const password = $('aPass').value;

    if (!username) { toast('Username wajib diisi', 'error'); $('aUser').focus(); return; }
    if (!password) { toast('Password wajib diisi', 'error'); $('aPass').focus(); return; }

    if (mode === 'register') {
      if (password.length < 8) { toast('Password minimal 8 karakter', 'error'); $('aPass').focus(); return; }
      if (password !== $('aPass2').value) { toast('Ulangi password belum sama', 'error'); $('aPass2').focus(); return; }
    }

    const btn = $('authSubmit');
    btn.classList.add('loading');
    btn.disabled = true;

    try {
      const path = mode === 'register' ? '/api/auth/register' : '/api/auth/login';
      const data = await api(path, { username, password });

      localStorage.setItem(TOKEN_KEY, data.token);
      localStorage.setItem(USER_KEY, JSON.stringify(data.user));

      if (data.inherited_data) {
        toast('Akun admin dibuat — data lama menjadi milik akun ini', 'success');
      } else {
        toast(mode === 'register' ? 'Akun dibuat, selamat datang' : 'Berhasil masuk', 'success');
      }
      setTimeout(() => location.replace('./index.html'), 600);
    } catch (e) {
      toast(e.message, 'error');
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  });

  // ── Inisialisasi ──
  if (new URLSearchParams(location.search).get('expired')) {
    toast('Sesi berakhir, silakan masuk lagi', 'info');
  }

  api('/api/auth/status').then((d) => {
    if (d && d.needs_setup) {
      $('setupBanner').style.display = 'flex';
      setMode('register');
    }
  }).catch(() => {
    toast('Tidak bisa menghubungi server', 'error');
  });

  $('aUser').focus();
})();
</script>
</body>
</html>
